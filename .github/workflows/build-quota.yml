name: Build TrollSpeed (Data Quota)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build .tipa on macOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and package
        run: |
          chmod +x ./build-quota.sh
          ./build-quota.sh

      - name: Upload .tipa
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeed-DataQuota-tipa
          path: packages/*.tipa
          if-no-files-found: error

      - name: Publish release with .tipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" packages/*.tipa \
            --title "TrollSpeed 悬浮窗背景版 #${{ github.run_number }}" \
            --notes "自动构建：悬浮窗新增磨砂极光玻璃背景（含液体流量条）。"
